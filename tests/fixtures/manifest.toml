[fixtures."python-tool-facts.txt"]
tool = "python"
version = "3.12.14"
kind = "captured_run"
argv = ["python", "-c", '''
import sys
import unittest

print(sys.version)
for value, expected in (("  Ann*  ", "Ann*"), ("\t*Bo\n", "*Bo")):
    actual = value.strip()
    assert actual == expected
    print(f"{value!r}.strip() = {actual!r}")
for name, expected in (("Ann*", True), ("*Bo", True), ("Ann", False)):
    actual = "*" in name
    assert actual is expected
    print(f'"*" in {name!r} = {actual}')
matching_code_points = [
    point for point in range(sys.maxunicode + 1) if "0" <= chr(point) <= "9"
]
assert matching_code_points == list(range(0x30, 0x3A))
print(f'Code points satisfying "0" <= char <= "9" across all {sys.maxunicode + 1} Python code points:')
print([f"U+{point:04X}" for point in matching_code_points])
for char in ("@", "\u0662", "\uff12", "\u00b2"):
    in_range = "0" <= char <= "9"
    assert not in_range
    print(f'U+{ord(char):04X} {char!r}: "0" <= char <= "9" = {in_range}')

for name, expected in (("@Ada", True), ("ada@home", True), ("Ada@", True), ("Ada", False)):
    contains_at = "@" in name
    assert contains_at is expected
    print(f'"@" in {name!r} = {contains_at}')

for name, expected in (
    ("#Ada", True), ("Ada#Lovelace", True), ("Ada#", True),
    ("Ada-Lovelace", False), ("Ada Lovelace", False),
):
    contains_hash = "#" in name
    assert contains_hash is expected
    print(f'"#" in {name!r} = {contains_hash}')

for name, expected in (
    ("Ada;Lovelace", True), (";Ada", True), ("Ada;", True),
    ("Ada", False), ("Ada Lovelace", False), ("", False),
):
    contains_semicolon = ";" in name
    assert contains_semicolon is expected
    print(f'";" in {name!r} = {contains_semicolon}')

for name, char in (
    ("Ada;\t", "\t"),
    ("Ada;\n", "\n"),
    ("Ada,;", ","),
    ("Ada;@", "@"),
    ("Ada;7", "7"),
    (";" * 21, ";"),
):
    assert char in name
    print(f'{char!r} in {name!r} = {char in name}')

for name, expected in (
    ("Ada,Bob", True),
    (",Ada", True),
    ("Ada,", True),
    ("Ada,@", True),
    ("Ada,7", True),
    ("Ada", False),
    ("Jean-Luc", False),
):
    contains_comma = "," in name
    assert contains_comma is expected
    print(f'"," in {name!r} = {contains_comma}')

for char in ("\t", "\n"):
    for name, expected in (
        (char + "Ada", True),
        ("Ada" + char + "Lovelace", True),
        ("Ada" + char, True),
        ("Ada Lovelace", False),
        ("", False),
    ):
        contains_char = char in name
        assert contains_char is expected
        print(f'{char!r} in {name!r} = {contains_char}')

for value in ("", "   ", "\t\n", " " * 21, " \t\nAda \t\n"):
    result = value.strip()
    expected = "Ada" if "Ada" in value else ""
    assert result == expected
    print(f"{value!r}.strip() = {result!r}; bool = {bool(result)}")

for value, expected in (
    ("A" * 20, 20),
    ("A" * 21, 21),
    ("@" * 21, 21),
    ("," * 21, 21),
    (";" * 21, 21),
    ("#" * 21, 21),
    ("A" * 20 + "1", 21),
    ("A" * 20 + "\t", 21),
    (" " + "A" * 20, 21),
    ("Bartholomew Montgomery", 22),
    ("\U0001f600", 1),
    ("e\u0301", 2),
):
    actual = len(value)
    assert actual == expected
    print(f"len({value!r}) = {actual}")

case = unittest.TestCase()
for message in (
    "name must not be empty",
    "name must be at most 20 characters",
    "name must not contain digits",
    "name must not contain @",
    "name must not contain a comma",
    "name must not contain a tab or newline",
    "name must not contain a semicolon",
    "name must not contain a hash",
    "punctuation must be one of . ! ?",
):
    raised = ValueError(message)
    with case.assertRaises(ValueError) as caught:
        raise raised
    case.assertIs(caught.exception, raised)
    case.assertIsInstance(caught.exception, ValueError)
    case.assertEqual(str(caught.exception), message)
    print(f"assertRaises.exception type = {type(caught.exception).__name__}")
    print(f"str(assertRaises.exception) = {str(caught.exception)!r}")

for value in (",", ";", "", "!!", " ", None, []):
    rejected = value not in (".", "!", "?")
    case.assertIs(rejected, True)
    print(f"{value!r} not in ('.', '!', '?') = {rejected}")

comparisons = []
class EqualityProbe:
    def __eq__(self, other):
        comparisons.append(other)
        return other == "!"

case.assertIn(EqualityProbe(), (".", "!", "?"))
case.assertEqual(comparisons, [".", "!"])
print(f"tuple membership equality comparisons = {comparisons!r}")

from greet import greet

for name, expected in (
    ("  Ann  ", "Hello, Ann."),
    ("\tBo\n", "Hello, Bo."),
    ("Ann", "Hello, Ann."),
):
    actual = greet(name)
    case.assertEqual(actual, expected)
    print(f'greet({name!r}) = {actual!r}')

for name, expected in (
    ("/Ada", True), ("Ada/Lovelace", True), ("Ada/", True),
    ("Ada", False), ("Ada\\Lovelace", False),
):
    contains_slash = "/" in name
    case.assertIs(contains_slash, expected)
    print(f'"/" in {name!r} = {contains_slash}')
case.assertNotEqual(ord("\\"), ord("/"))
print(f'backslash = U+{ord(chr(92)):04X}; slash = U+{ord("/"):04X}')
case.assertEqual(greet("Ada\\Lovelace"), "Hello, Ada\\Lovelace.")
print(f'greet backslash name = {greet("Ada\\Lovelace")!r}')
case.assertEqual(len("/" * 21), 21)
print(f'len("/" * 21) = {len("/" * 21)}')
for name, char in (
    ("Ada;/", ";"), ("Ada,/", ","), ("Ada/@", "@"),
    ("Ada/\t", "\t"), ("Ada/\n", "\n"),
):
    case.assertIn(char, name)
    print(f'{char!r} in {name!r} = {char in name}')
case.assertTrue("x" not in (".", "!", "?"))
print(f'"x" not in (".", "!", "?") = {"x" not in (".", "!", "?")}')
for name, mark, message in (
    ("#" * 21, ".", "name must be at most 20 characters"),
    ("Ada#7", ".", "name must not contain digits"),
    ("Ada#", "x", "name must not contain a hash"),
    ("/" * 21, ".", "name must be at most 20 characters"),
    ("Ada;/", ".", "name must not contain a semicolon"),
    ("Ada,/", ".", "name must not contain a comma"),
    ("Ada/@", ".", "name must not contain @"),
    ("Ada/\t", ".", "name must not contain a slash"),
    ("Ada/\n", ".", "name must not contain a slash"),
    ("Ada/7", ".", "name must not contain digits"),
    ("Ada/", "x", "name must not contain a slash"),
    ("Ada", "x", "punctuation must be one of . ! ?"),
):
    with case.assertRaises(ValueError) as caught:
        greet(name, mark)
    case.assertEqual(str(caught.exception), message)
    print(f'greet({name!r}, {mark!r}) raises ValueError({str(caught.exception)!r})')

visited = []
reported = []
class SubTestProbe(unittest.TestCase):
    def test_loop(self):
        for value in range(3):
            with self.subTest(value=value):
                visited.append(value)
                self.assertEqual(value, 2)

class RecordingResult(unittest.TestResult):
    def addSubTest(self, test, subtest, err):
        reported.append((str(subtest), "passed" if err is None else "failed"))
        super().addSubTest(test, subtest, err)

result = RecordingResult()
SubTestProbe("test_loop").run(result)
case.assertEqual(visited, [0, 1, 2])
case.assertEqual([status for _, status in reported], ["failed", "failed", "passed"])
case.assertEqual(result.testsRun, 1)
case.assertEqual(len(result.failures), 2)
case.assertEqual(len(result.errors), 0)
for subtest, status in reported:
    print(f"subTest report: {subtest}: {status}")
print(f"visited after intentional subTest failure = {visited!r}")
print(f"test methods run = {result.testsRun}; recorded failures = {len(result.failures)}")
''']
