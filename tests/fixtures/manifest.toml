[fixtures."python-tool-facts.txt"]
tool = "python"
version = "3.12.14"
kind = "captured_run"
argv = ["python", "-c", '''
import sys
import unittest

print(sys.version)
matching_code_points = [
    point for point in range(sys.maxunicode + 1) if "0" <= chr(point) <= "9"
]
assert matching_code_points == list(range(0x30, 0x3A))
print(f'Code points satisfying "0" <= char <= "9" across all {sys.maxunicode + 1} Python code points:')
print([f"U+{point:04X}" for point in matching_code_points])
for char in ("@", "\u0662", "\uff12", "\u00b2"):
    in_range = "0" <= char <= "9"
    assert not in_range
    print(f'U+{ord(char):04X} {char!r}: "0" <= char <= "9" = {in_range}')

for name, expected in (("@Ada", True), ("ada@home", True), ("Ada@", True), ("Ada", False)):
    contains_at = "@" in name
    assert contains_at is expected
    print(f'"@" in {name!r} = {contains_at}')

for value in ("", "   ", "\t\n", " " * 21, " \t\nAda \t\n"):
    result = value.strip()
    expected = "Ada" if "Ada" in value else ""
    assert result == expected
    print(f"{value!r}.strip() = {result!r}; bool = {bool(result)}")

for value, expected in (
    ("A" * 20, 20),
    ("A" * 21, 21),
    ("@" * 21, 21),
    ("A" * 20 + "1", 21),
    (" " + "A" * 20, 21),
    ("Bartholomew Montgomery", 22),
    ("\U0001f600", 1),
    ("e\u0301", 2),
):
    actual = len(value)
    assert actual == expected
    print(f"len({value!r}) = {actual}")

case = unittest.TestCase()
for message in (
    "name must not be empty",
    "name must be at most 20 characters",
    "name must not contain digits",
    "name must not contain @",
    "punctuation must be one of . ! ?",
):
    raised = ValueError(message)
    with case.assertRaises(ValueError) as caught:
        raise raised
    case.assertIs(caught.exception, raised)
    case.assertIsInstance(caught.exception, ValueError)
    case.assertEqual(str(caught.exception), message)
    print(f"assertRaises.exception type = {type(caught.exception).__name__}")
    print(f"str(assertRaises.exception) = {str(caught.exception)!r}")

from greet import greet

for name, expected in (
    ("ada@home", "name must not contain @"),
    ("@" * 21, "name must be at most 20 characters"),
):
    with case.assertRaises(ValueError) as caught:
        greet(name)
    case.assertEqual(str(caught.exception), expected)
    print(f"greet({name!r}) raises ValueError({str(caught.exception)!r})")

for value in (",", "", "!!", " ", None, []):
    rejected = value not in (".", "!", "?")
    case.assertIs(rejected, True)
    print(f"{value!r} not in ('.', '!', '?') = {rejected}")

comparisons = []
class EqualityProbe:
    def __eq__(self, other):
        comparisons.append(other)
        return other == "!"

case.assertIn(EqualityProbe(), (".", "!", "?"))
case.assertEqual(comparisons, [".", "!"])
print(f"tuple membership equality comparisons = {comparisons!r}")

visited = []
reported = []
class SubTestProbe(unittest.TestCase):
    def test_loop(self):
        for value in range(3):
            with self.subTest(value=value):
                visited.append(value)
                self.assertNotEqual(value, 0)

class RecordingResult(unittest.TestResult):
    def addSubTest(self, test, subtest, err):
        reported.append((str(subtest), "passed" if err is None else "failed"))
        super().addSubTest(test, subtest, err)

result = RecordingResult()
SubTestProbe("test_loop").run(result)
case.assertEqual(visited, [0, 1, 2])
case.assertEqual([status for _, status in reported], ["failed", "passed", "passed"])
case.assertEqual(result.testsRun, 1)
case.assertEqual(len(result.failures), 1)
case.assertEqual(len(result.errors), 0)
for subtest, status in reported:
    print(f"subTest report: {subtest}: {status}")
print(f"visited after intentional subTest failure = {visited!r}")
print(f"test methods run = {result.testsRun}; recorded failures = {len(result.failures)}")
''']
