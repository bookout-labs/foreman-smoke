check: python -m pytest -q -p no:cacheprovider tests --junitxml=reports/junit.xml
verify_skill: .cursor/skills/verify-foreman-smoke/SKILL.md
test_report: reports/junit.xml
image: python:3.12-slim
setup:
  - pip install --quiet --disable-pip-version-check --no-cache-dir --root-user-action=ignore pytest==8.3.4
secrets: []
start:
  command: python app.py
  health: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
  timeout_seconds: 30
mutation:
  command: python tools/mutate.py
  sample_cap: 10
production_check:
  command: python3 tools/production_check.py "$1"
  not_deployed_exit: 3
  timeout_seconds: 90
